<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<meta name="theme-color" content="#070509" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>金芷伊生日快乐 · 手势星河</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  min-height: 100dvh;
  overflow: hidden;
  background: #000;
  color: #e8eeff;
  font: 14px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
  user-select: none;
}

.hidden { display: none !important; }

/* 深空底色。CSS 变量 --nebula 由程序按 config.look.nebula 设置，
   0 = 纯黑（星星最亮眼），大一点会有一层极淡的星云色。 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(58% 44% at 24% 22%, rgba(211, 157, 82, calc(0.09 * var(--nebula, 0.45))), transparent 70%),
    radial-gradient(54% 42% at 76% 72%, rgba(214, 94, 126, calc(0.075 * var(--nebula, 0.45))), transparent 70%),
    radial-gradient(46% 58% at 56% 8%, rgba(72, 113, 168, calc(0.06 * var(--nebula, 0.45))), transparent 70%),
    radial-gradient(82% 82% at 50% 50%, #070509 0%, #000 78%);
  z-index: 0;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

#skeleton {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  z-index: 2;
}

#cam { display: none; }

/* ---------- HUD ---------- */
#hud {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  left: 18px;
  z-index: 4;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(8, 12, 26, 0.42);
  border: 1px solid rgba(120, 170, 255, 0.16);
  backdrop-filter: blur(6px);
  min-width: 190px;
}

#title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 3px;
  color: transparent;
  background: linear-gradient(90deg, #fff6dd 0%, #ffd27e 48%, #ff9fae 100%);
  -webkit-background-clip: text;
  background-clip: text;
  text-shadow: 0 0 18px rgba(255, 190, 128, 0.46);
}

#hud .row { display: flex; align-items: center; gap: 7px; margin-top: 6px; color: #9fb6de; font-size: 12px; }
#hud .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #5ce1a0;
  box-shadow: 0 0 8px #5ce1a0;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

.dim { color: #8ea3c8; font-size: 12px; }

/* 当前手势意图（由平滑后的开合度推出来，不是原始识别值） */
#intent-label {
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 1px;
  color: #ffe6a6;
  text-shadow: 0 0 14px rgba(255, 210, 120, 0.5);
}

/* 按 D 显示的手型数据（排查方向问题时很有用） */
#hand-debug {
  position: fixed;
  top: 152px;
  left: 18px;
  z-index: 4;
  margin: 0;
  padding: 9px 12px;
  border-radius: 10px;
  background: rgba(8, 12, 26, 0.5);
  border: 1px solid rgba(120, 170, 255, 0.16);
  color: #a9c6f0;
  font: 11px/1.6 Consolas, "Courier New", monospace;
  white-space: pre;
  pointer-events: none;
}

#measure { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.measure-label { font-size: 12px; color: #9fb6de; }
#measure .meter {
  position: relative;
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(140, 180, 255, 0.16);
  overflow: hidden;
}
#measure .meter i {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--v, 100%);
  background: linear-gradient(90deg, #fff4d6, #ffd27e, #ff9fae);
  box-shadow: 0 0 12px rgba(255, 190, 128, 0.85);
  transition: width .06s linear;
}
#measure .pct { font-size: 12px; color: #cfe2ff; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

#hints {
  position: fixed;
  left: 0; right: 0; bottom: 14px;
  z-index: 4;
  text-align: center;
  line-height: 1.7;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
}
#hints b { color: #ffe9a8; font-weight: 600; }

/* ---------- 提示 / 错误 / 加载 ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: 108px;
  transform: translate(-50%, 12px);
  z-index: 6;
  padding: 9px 18px;
  border-radius: 999px;
  background: rgba(10, 16, 34, 0.82);
  border: 1px solid rgba(130, 180, 255, 0.28);
  color: #dce9ff;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.start-panel {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(86vw, 360px);
  text-align: center;
  z-index: 8;
}

.start-mark {
  font-size: 34px;
  line-height: 1;
  color: #ffd27e;
  text-shadow: 0 0 22px rgba(255, 180, 110, 0.75);
}

.start-title {
  margin-top: 10px;
  color: #fff3d6;
  font-size: 18px;
  letter-spacing: 2px;
}

#start-button {
  appearance: none;
  margin-top: 18px;
  padding: 11px 32px;
  border: 1px solid rgba(255, 212, 130, 0.55);
  border-radius: 999px;
  color: #1c1008;
  background: linear-gradient(120deg, #fff2c9, #ffd17c 55%, #ff9fa9);
  font: 700 15px/1 "Microsoft YaHei UI", "微软雅黑", sans-serif;
  letter-spacing: 2px;
  box-shadow: 0 8px 28px rgba(255, 164, 110, 0.25);
}

#start-button:active {
  transform: scale(0.97);
}

.panel {
  position: fixed;
  z-index: 5;
  padding: 18px 22px;
  border-radius: 14px;
  background: rgba(9, 13, 28, 0.72);
  border: 1px solid rgba(130, 180, 255, 0.2);
  backdrop-filter: blur(8px);
}
.center-panel {
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  max-width: 420px;
}
.center-panel p { margin-top: 8px; }
.error-panel {
  left: 50%; bottom: 96px;
  transform: translateX(-50%);
  max-width: min(680px, 90vw);
  color: #ffd9d9;
  border-color: rgba(255, 130, 130, 0.35);
  background: rgba(38, 10, 14, 0.8);
  text-align: center;
  line-height: 1.7;
}
.spinner {
  width: 30px; height: 30px;
  margin: 0 auto 12px;
  border-radius: 50%;
  border: 2px solid rgba(140, 190, 255, 0.25);
  border-top-color: #8ec5ff;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* 摄像头画面隐藏时（按 V）保持纯星空 */
#stage.no-cam { background: transparent; }

@media (max-width: 760px) {
  #hud {
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    min-width: 0;
    padding: 9px 11px;
  }

  #title {
    font-size: 13px;
    letter-spacing: 2px;
  }

  #hints {
    display: none;
  }

  .center-panel {
    max-width: 86vw;
  }
}

</style>
</head>
<body>
  <!-- 摄像头画面被读进 WebGL 当背景，这个 video 本身不显示 -->
  <video id="cam" class="hidden" playsinline muted autoplay></video>

  <canvas id="stage"></canvas>
  <canvas id="skeleton"></canvas>

  <div id="loading" class="panel center-panel">
    <div class="spinner"></div>
    <p id="loading-text">正在启动摄像头并加载手部识别模型…</p>
    <p class="dim">首次加载约 7MB 模型，已随程序离线保存，不需要联网。</p>
  </div>

  <div id="error" class="panel error-panel" hidden></div>

  <div id="start-gate" class="panel start-panel" hidden>
    <div class="start-mark">✦</div>
    <div class="start-title">金芷伊生日快乐</div>
    <button id="start-button" type="button">点击开始</button>
    <p class="dim">需要使用摄像头识别握拳和张开手势</p>
  </div>

  <div id="hud">
    <div id="title">金芷伊生日快乐</div>
    <div class="row">
      <span class="dot"></span>
      <span id="fps">-- FPS</span>
    </div>
    <div id="intent-label">张开 · 文字亮起</div>
    <div id="center-readout" class="dim">鼠标 · 聚合 0%</div>
    <div id="measure">
      <span class="measure-label">开合度</span>
      <div class="meter"><i></i></div>
      <span id="measure-label" class="pct">100%</span>
    </div>
  </div>

  <pre id="hand-debug" class="hidden"></pre>

  <div id="hints">
    <div><b>五指收紧（握拳）</b> → 星光聚合 &nbsp;|&nbsp; <b>手掌张开</b> → 金芷伊生日快乐</div>
    <div class="dim">画面只显示星星（不画摄像头和骨架，才不会被摄像头帧率拖慢）</div>
    <div class="dim">I 反转方向 · C 查看阈值 · D 数据 · V 摄像头画面 · S 骨架 · G 指示环 · R 重排文字 · H 隐藏提示 · M 镜像</div>
  </div>

  <div id="toast"></div>
  <pre id="selftest-result" hidden></pre>
  <pre id="js-errors" hidden></pre>

        showToast(inv ? "\u5DF2\u53CD\u8F6C\u624B\u52BF\u65B9\u5411\uFF08\u5F53\u524D\uFF1A\u63E1\u62F3 = \u805A\u5408\uFF09" : "\u624B\u52BF\u65B9\u5411\u5DF2\u6062\u590D", 3e3);
      } else {
        showToast("\u624B\u90E8\u8BC6\u522B\u8FD8\u6CA1\u5C31\u7EEA", 2e3);
      }
    } else if (k === "c") {
      showToast(
        `\u65B9\u5411\uFF1A${config.intent.invert ? "\u5DF2\u53CD\u8F6C" : "\u6B63\u5E38"} \xB7 \u9608\u503C \u5F20\u5F00 ${config.intent.openRatio} / \u63E1\u62F3 ${config.intent.fistRatio}\uFF08\u56FA\u5B9A\uFF0C\u4E0D\u968F\u65F6\u95F4\u53D8\u5316\uFF09`,
        3600
      );
    } else if (k === "v") {
      config.view.showCamera = !config.view.showCamera;
      showToast(config.view.showCamera ? "\u663E\u793A\u6444\u50CF\u5934\u753B\u9762\uFF08\u6CE8\u610F\uFF1A\u5B83\u4F1A\u8DDF\u7740\u6444\u50CF\u5934\u5E27\u7387\uFF09" : "\u7EAF\u661F\u7A7A");
    } else if (k === "s") {
      config.view.showSkeleton = !config.view.showSkeleton;
      showToast(config.view.showSkeleton ? "\u663E\u793A\u9AA8\u67B6\uFF08\u53D7\u6444\u50CF\u5934\u5E27\u7387\u9650\u5236\uFF09" : "\u9690\u85CF\u9AA8\u67B6");
    } else if (k === "g") {
      config.view.showGestureRing = !config.view.showGestureRing;
      showToast(config.view.showGestureRing ? "\u663E\u793A\u610F\u56FE\u6307\u793A\u73AF" : "\u9690\u85CF\u6307\u793A\u73AF");
    } else if (k === "r") {
      field.regenerate();
      showToast("\u91CD\u65B0\u6392\u5217\u201C\u91D1\u82B7\u4F0A\u751F\u65E5\u5FEB\u4E50\u201D");
    } else if (k === "h") {
      hints.classList.toggle("hidden");
      hud.classList.toggle("hidden");
    } else if (k === "d") {
      handDebug.classList.toggle("hidden");
    } else if (k === "m") {
      config.camera.mirror = !config.camera.mirror;
      showToast(config.camera.mirror ? "\u955C\u50CF\uFF1A\u5F00" : "\u955C\u50CF\uFF1A\u5173");
    }
  });
  function drawSkeleton(lm, tight) {
    const w = skeleton.clientWidth;
    const h = skeleton.clientHeight;
    const mirror = config.camera.mirror;
    const px = (i) => (mirror ? 1 - lm[i].x : lm[i].x) * w;
    const py = (i) => lm[i].y * h;
    const thickness = Math.max(1.6, tracker.palmSize(lm) * h * 0.02);
    const cr = Math.round(90 + 165 * tight);
    const cg = Math.round(235 - 55 * tight);
    const cb = Math.round(255 - 185 * tight);
    sctx.lineWidth = thickness;
    sctx.strokeStyle = `rgba(${cr},${cg},${cb},0.55)`;
    sctx.shadowColor = `rgba(${cr},${cg},${cb},0.9)`;
    sctx.shadowBlur = 10;
    sctx.beginPath();
    for (const [a, b] of HandTracker.CONNECTIONS) {
      sctx.moveTo(px(a), py(a));
      sctx.lineTo(px(b), py(b));
    }
    sctx.stroke();
    sctx.shadowBlur = 14;
    sctx.fillStyle = `rgba(${cr},${cg},${cb},0.95)`;
    for (let i = 0; i < lm.length; i++) {
      const r = i === 0 || i === 9 ? thickness * 1.5 : thickness * 0.85;
      sctx.beginPath();
      sctx.arc(px(i), py(i), r, 0, Math.PI * 2);
      sctx.fill();
    }
  }
  function drawIntentRing(showSkeleton, lm, tight) {
    const w = skeleton.clientWidth;
    const h = skeleton.clientHeight;
    sctx.clearRect(0, 0, w, h);
    if (showSkeleton && lm) drawSkeleton(lm, tight);
    const fade = clamp012(handState.engage);
    if (!config.view.showGestureRing || fade < 0.02) return;
    const cx = handState.x * w;
    const cy = handState.y * h;
    const open = clamp012(1 - tight);
    const cr = Math.round(90 + 165 * tight);
    const cg = Math.round(235 - 55 * tight);
    const cb = Math.round(255 - 185 * tight);
    const base = Math.max(26, Math.min(w, h) * 0.05);
    const radius = base * (0.5 + 0.85 * open);
    sctx.save();
    sctx.globalAlpha = fade;
    sctx.strokeStyle = `rgba(${cr},${cg},${cb},0.5)`;
    sctx.lineWidth = 2;
    sctx.beginPath();
    sctx.arc(cx, cy, radius, 0, Math.PI * 2);
    sctx.stroke();
    sctx.fillStyle = `rgba(${cr},${cg},${cb},0.85)`;
    sctx.beginPath();
    sctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    sctx.fill();
    if (!handDebug.classList.contains("hidden")) {
      sctx.setLineDash([4, 5]);
      sctx.strokeStyle = "rgba(255,255,255,0.35)";
      sctx.lineWidth = 1.5;
      sctx.beginPath();
      sctx.arc(handState.rawX * w, handState.rawY * h, radius * 0.8, 0, Math.PI * 2);
      sctx.stroke();
      sctx.beginPath();
      sctx.moveTo(cx, cy);
      sctx.lineTo(handState.rawX * w, handState.rawY * h);
      sctx.stroke();
    }
    sctx.restore();
  }
  async function bootTracker() {
    setLoading("\u6B63\u5728\u52A0\u8F7D\u624B\u90E8\u8BC6\u522B\u6A21\u578B\u2026");
    const t = new HandTracker(video, config);
    await t.init();
    tracker = t;
    hideLoading();
    showToast("\u5C31\u7EEA\uFF1A\u63E1\u7D27\u62F3\u5934 \u2192 \u661F\u5149\u805A\u5408\uFF1B\u5F20\u5F00\u624B\u638C \u2192 \u91D1\u82B7\u4F0A\u751F\u65E5\u5FEB\u4E50", 4200);
  }
  function handleTrackerFailure(err) {
    hideLoading();
    fail("\u624B\u90E8\u8BC6\u522B\u542F\u52A8\u5931\u8D25\uFF1A" + (err?.message || err) + "\uFF08\u7C92\u5B50\u6587\u5B57\u4ECD\u53EF\u6B63\u5E38\u89C2\u770B\uFF09");
    noteError("\u624B\u90E8\u8BC6\u522B", err);
  }
  function beginTracker() {
    if (startGate) startGate.hidden = true;
    if (loading) loading.hidden = false;
    bootTracker().catch(handleTrackerFailure);
  }
  if (isMobileDevice && startGate && startButton) {
    if (loading) loading.hidden = true;
    startGate.hidden = false;
    startButton.addEventListener("click", beginTracker, { once: true });
  } else {
    beginTracker();
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("Service Worker \u6CE8\u518C\u5931\u8D25\uFF0C\u9875\u9762\u4ECD\u53EF\u6B63\u5E38\u4F7F\u7528\uFF1A", err);
      });
    });
  }
  if (new URLSearchParams(location.search).has("test")) {
    Promise.resolve().then(() => (init_selftest(), selftest_exports)).then(
      ({ installSelfTest: installSelfTest2 }) => installSelfTest2({ galaxy: field, config, errors: jsErrors, resultEl: $("selftest-result") })
    ).catch((err) => noteError("\u81EA\u68C0", err));
  }
  function updateIntent(now) {
    handFrame++;
    if (!tracker || !tracker.ready) return;
    if (handFrame < perf.detectInterval) return;
    handFrame = 0;
    const det = tracker.detect();
    if (!det) return;
    handState.engaged = true;
    handState.lastDetect = now;
    handState.lastSeen = now;
    handState.lastCaptureAt = det.captureAt || now;
    handState.videoAgeMs = det.ageMs || 0;
    handState.rawX = det.center.x;
    handState.rawY = det.center.y;
    handState.openRaw = det.open;
    handState.vx = tracker.centerVel.x;
    handState.vy = tracker.centerVel.y;
  }
  function frame(now) {
    const dt = Math.min(50, Math.max(4, now - last));
    last = now;
    dtScale = dt / 16.7;
    fpsFrames++;
    fpsClock += dt;
    if (fpsClock > 400) {
      fps = Math.round(fpsFrames * 1e3 / fpsClock);
      fpsFrames = 0;
      fpsClock = 0;
      tunePerformance(fps, dt);
    }
    field.advance(dt);
    updateIntent(now);
    const seeingHand = handState.engaged && now - handState.lastSeen < (config.intent.engageMs || 1600);
    const kEngage = smoothK(Math.max(0.05, (config.intent.engageRampMs || 500) / 1e3 / 2.2), dt);
    handState.engage = clamp012(lerp(handState.engage, seeingHand ? 1 : 0, kEngage));
    if (!seeingHand) handState.engaged = false;
    const sinceCapture = Math.max(0, now - (handState.lastCaptureAt || now));
    const age = Math.min(400, sinceCapture);
    const lead = (config.intent.leadMs || 0) / 1e3;
    const maxLead = config.intent.maxLeadPx || 0.22;
    const velDecay = Math.exp(-sinceCapture / 1e3 / Math.max(0.05, config.intent.velReleaseTau || 0.35));
    const predX = handState.rawX + handState.vx * velDecay * (age / 1e3 + lead);
    const predY = handState.rawY + handState.vy * velDecay * (age / 1e3 + lead);
    const px = handState.rawX + Math.max(-maxLead, Math.min(maxLead, predX - handState.rawX));
    const py = handState.rawY + Math.max(-maxLead, Math.min(maxLead, predY - handState.rawY));
    const kPos = smoothK(config.intent.posTau || 0.055, dt);
    const tauOpen = config.intent.openTau || 0.1;
    const tauClose = config.intent.closeTau || 0.28;
    const rateOpen = smoothK(tauOpen, dt);
    const rateClose = smoothK(tauClose, dt);
    const mouseTargetX = control.pointer.x;
    const mouseTargetY = control.pointer.y;
    const targetX = lerp(mouseTargetX, px, handState.engage);
    const targetY = lerp(mouseTargetY, py, handState.engage);
    handState.x = lerp(handState.x, targetX, kPos);
    handState.y = lerp(handState.y, targetY, kPos);
    const openHand = applyDeadzone2(tracker ? tracker.openness : 1);
    const openTarget = lerp(1, openHand, handState.engage);
    const rate = openTarget > handState.open ? rateOpen : rateClose;
    handState.open = lerp(handState.open, openTarget, rate);
    const handCollapse = 1 - handState.open;
    const mouseCollapse = control.keyCollapse > 0 || control.pointer.down ? 1 : clamp012((control.pointer.y - 0.15) / 0.7);
    const collapse = lerp(mouseCollapse, handCollapse, handState.engage);
    const source = handState.engage > 0.5 ? "hand" : mouseCollapse > 0.5 ? "manual" : "pointer";
    control.collapse = collapse;
    control.source = source;
    field.setCenter(clamp012(handState.x), clamp012(handState.y));
    field.setCollapse(collapse);
    if (config.view.showCamera && video.readyState >= 2) {
      field.drawVideo(video);
    }
    field.render(dt);
    drawIntentRing(
      config.view.showSkeleton && handState.engage > 0.05,
      handState.engage > 0.05 ? tracker.lastLandmarks : null,
      collapse
    );
    syncMeasure(lerp(1 - mouseCollapse, handState.open, handState.engage));
    const srcText = source === "hand" ? "\u624B\u52BF" : source === "manual" ? "\u952E\u76D8/\u9F20\u6807" : "\u9F20\u6807\u4F4D\u7F6E";
    const perfText = perf.level > 0 ? ` \xB7 \u7701\u7535\u6863${perf.level}` : "";
    fpsEl.textContent = tracker?.ready ? `${fps} FPS${perfText}` : `${fps} FPS \xB7 \u8BC6\u522B\u672A\u542F\u7528`;
    centerReadout.textContent = `${srcText} \xB7 \u805A\u5408 ${(collapse * 100).toFixed(0)}%`;
    if (tracker?.ready && handDebug && !handDebug.classList.contains("hidden")) {
      const d = tracker.debugInfo;
      const lag = Math.hypot(handState.x - handState.rawX, handState.y - handState.rawY);
      handDebug.textContent = `\u624B\u578B\u5EA6\u91CF ${Number.isFinite(d.metric) ? d.metric.toFixed(3) : "--"}
\u56FA\u5B9A\u9608\u503C \u63E1\u62F3 ${d.min} ~ \u5F20\u5F00 ${d.max}${d.inverted ? "\uFF08\u5DF2\u53CD\u8F6C\uFF09" : ""} \xB7 \u4E0D\u968F\u65F6\u95F4\u53D8\u5316
\u5F00\u5408\u5EA6 \u539F\u59CB ${(handState.openRaw * 100).toFixed(0)}% \u2192 \u5E73\u6ED1 ${(handState.open * 100).toFixed(0)}%
\u5916\u63A8\u9886\u5148 ${(lag * 100).toFixed(1)}% \u5C4F\u5BBD \xB7 \u8BC6\u522B\u95F4\u9694 ${age.toFixed(0)}ms
${fps} FPS \xB7 \u8BC6\u522B\u6BCF ${perf.detectInterval} \u5E27 \xB7 \u6E32\u67D3 ${perf.dprCap}x`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
